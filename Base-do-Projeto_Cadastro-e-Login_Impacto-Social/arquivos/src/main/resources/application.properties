# =====================================================================
# PRATO SOLIDARIO - configuracao da aplicacao
# Os valores entre ${...:padrao} podem ser trocados por variaveis de
# ambiente (DB_URL, DB_USER, DB_PASSWORD, PORT) sem alterar este arquivo.
# =====================================================================
spring.application.name=prato-solidario
server.port=${PORT:8080}

# ---------- Conexao com o PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prato_solidario}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------- Execucao automatica dos scripts da pasta /database ----------
# (o pom.xml copia /database para o classpath em db/)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/01_schema.sql
spring.sql.init.data-locations=classpath:db/02_seed.sql
spring.sql.init.encoding=UTF-8

# ---------- JSON e datas no formato ISO (2026-11-20 / 2026-11-20T18:00) ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# ---------- Mensagens de erro ----------
server.error.include-message=always
logging.level.br.com.pratosolidario=INFO
