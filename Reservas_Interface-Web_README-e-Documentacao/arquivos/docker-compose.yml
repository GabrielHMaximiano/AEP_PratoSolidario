# Sobe um PostgreSQL 16 pronto para o Prato Solidário (Windows, Linux ou macOS).
#   docker compose up -d        -> inicia o banco
#   docker compose down         -> para o banco (os dados ficam no volume)
#   docker compose down -v      -> para e APAGA os dados
services:
  postgres:
    image: postgres:16
    container_name: prato-solidario-db
    environment:
      POSTGRES_DB: prato_solidario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
